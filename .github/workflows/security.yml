name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

jobs:
  audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm audit is always free and works for all repositories
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate --json > npm-audit.json || true
        continue-on-error: true

      - name: Display audit summary
        run: |
          if [ -f npm-audit.json ]; then
            echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            parse_error=0
            vulnerabilities=$(jq -r '
              (.metadata.vulnerabilities // {}) as $v |
              if ($v == {}) then "" else
                $v | to_entries | map("\(.key): \(.value)") | join("\n")
              end
            ' npm-audit.json 2>/dev/null) || parse_error=1

            total_vulnerabilities=$(jq -r '
              (.metadata.vulnerabilities // {}) as $v |
              reduce ($v[]?) as $count (0; . + ($count // 0))
            ' npm-audit.json 2>/dev/null) || parse_error=1

            if [ "$parse_error" -ne 0 ] || ! [[ "$total_vulnerabilities" =~ ^[0-9]+$ ]]; then
              echo "⚠️ Unable to parse npm audit output." >> $GITHUB_STEP_SUMMARY
            elif [ "$total_vulnerabilities" -gt 0 ]; then
              echo "### Vulnerabilities Found:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$vulnerabilities" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 7
          if-no-files-found: ignore

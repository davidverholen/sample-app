name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          CI: true
        run: npm test -- --coverage

      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ Coverage file not found!"
            exit 1
          fi
          echo "✅ Coverage report generated successfully"

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
        timeout-minutes: 2

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup database schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: npx prisma db push --accept-data-loss || true

      - name: Build application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-for-build-min-32-chars' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
          echo "✅ Build completed successfully"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # E2E tests are slower - make them optional for faster CI
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-min-32-chars-long
          CI: true
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  commit-message:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            auth
            api
            ui
            db
            config
            deps
            workflows
            ci
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in commit "{commitMessage}" doesn't match the required pattern.
            Please ensure the subject line starts with a lowercase letter.

  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            auth
            api
            ui
            db
            config
            deps
            workflows
            ci
          requireScope: false

      - name: Validate branch naming
        run: |
          BRANCH_NAME="${{ github.head_ref }}"

          # Check for release branches (format: release/v1.2.3)
          if [[ "$BRANCH_NAME" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "✅ Branch name '$BRANCH_NAME' follows the release format"
            exit 0
          fi

          # Check for feature/bugfix/hotfix branches (format: type/issue-number-description)
          if [[ "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix)/[0-9]+-.*$ ]]; then
            echo "✅ Branch name '$BRANCH_NAME' follows the required format"
            exit 0
          fi

          # If we get here, the branch name is invalid
          echo "❌ Branch name '$BRANCH_NAME' does not follow the required format!"
          echo ""
          echo "Branch names must follow one of these patterns:"
          echo "  - <type>/<issue-number>-<description> (for feature, bugfix, hotfix)"
          echo "  - release/v<version> (for releases, e.g., release/v1.2.3)"
          echo ""
          echo "Valid types: feature, bugfix, hotfix, release"
          echo "Examples:"
          echo "  ✅ feature/123-user-authentication"
          echo "  ✅ bugfix/456-login-error"
          echo "  ✅ hotfix/789-security-patch"
          echo "  ✅ release/v1.2.3"
          echo "  ✅ release/v1.2.3-rc.1"
          echo ""
          echo "Current branch: $BRANCH_NAME"
          exit 1

      - name: Comment PR on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];

            // Check if PR title validation failed
            if ('${{ job.status }}' === 'failure') {
              failures.push('⚠️ PR title does not follow the Conventional Commits format. Please update it to: `<type>(<scope>): <subject>`');
            }

            // Check if branch naming failed
            if (failures.length > 0) {
              const body = `## ❌ PR Validation Failed\n\n${failures.join('\n\n')}\n\nPlease fix the issues above and push again.`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, type-check, test, build, e2e, security, commit-message, pr-checks]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Generate PR summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'lint': '${{ needs.lint.result }}',
              'type-check': '${{ needs.type-check.result }}',
              'test': '${{ needs.test.result }}',
              'build': '${{ needs.build.result }}',
              'e2e': '${{ needs.e2e.result }}',
              'security': '${{ needs.security.result }}',
              'commit-message': '${{ needs.commit-message.result }}',
              'pr-checks': '${{ needs.pr-checks.result }}'
            };

            // Filter out skipped jobs and create summary
            const activeJobs = Object.entries(jobs).filter(([_, status]) => status !== 'skipped');
            const allPassed = activeJobs.every(([_, status]) => status === 'success');
            const emoji = allPassed ? '✅' : '⚠️';
            const status = allPassed ? 'All checks passed!' : 'Some checks failed';

            let body = `## ${emoji} CI Checks Summary: ${status}\n\n`;
            body += '| Check | Status |\n';
            body += '|-------|--------|\n';

            for (const [job, status] of Object.entries(jobs)) {
              if (status === 'skipped') continue;
              const statusEmoji = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⏳';
              body += `| ${job} | ${statusEmoji} ${status} |\n`;
            }

            body += '\n---\n';
            body += '**Note**: This is an automated summary. Check the [Actions tab](https://github.com/${{ github.repository }}/actions) for detailed logs.\n';

            // Post comment (only if PR exists)
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
